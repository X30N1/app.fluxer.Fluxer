name: wasm-bindgen-cli
buildsystem: simple
cleanup:
  - '*'
build-options:
  env:
    CARGO_HOME: /run/build/wasm-bindgen-cli/cargo
    CARGO_NET_OFFLINE: 'true'
build-commands:
  - cargo --offline build --release --locked --bin wasm-bindgen
  - install -Dm755 target/release/wasm-bindgen -t ${FLATPAK_DEST}/rust/bin
sources:
  - type: archive
    archive-type: tar-gzip
    url: https://static.crates.io/crates/wasm-bindgen-cli/wasm-bindgen-cli-0.2.128.crate
    sha256: 2e29140c04e81832902b70e5d37b9ce1bfa811c8fe4563bea08f76df8388cf20
  - wasm-bindgen-cli-sources.json
